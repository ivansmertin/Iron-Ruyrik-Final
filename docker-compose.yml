services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhelezny-ryurik-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///../data/zhelezny_ryurik.db
      - FRONTEND_ORIGINS=http://178.20.44.68,http://localhost:5173
      - APP_TIMEZONE=Europe/Moscow
      - DEV_AUTH_ENABLED=true
      - DEV_USER_ID=00000000-0000-0000-0000-000000000001
      - DEV_ADMIN_USER_ID=00000000-0000-0000-0000-000000000002
      - LOG_LEVEL=INFO
