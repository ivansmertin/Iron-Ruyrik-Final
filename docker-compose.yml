services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhelezny-ryurik-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/data/zhelezny_ryurik.db
      - BACKUP_DIR=/app/backups
      - FRONTEND_ORIGINS=http://178.20.44.68
      - APP_TIMEZONE=Europe/Moscow
      - DEV_AUTH_ENABLED=false
      - LOG_LEVEL=INFO
